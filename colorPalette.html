<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Palette Generator</title>
    <link rel="stylesheet" href="colorPalette.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="alert"></div>
    <div class="container">
        <h1 class="title">Color Palette Generator</h1>
        <button class="generate-btn">
            <i class="fas fa-sync-alt"></i>Generate Palette</button>
        <div class="palette-container">
            <div class="color-box">
                <div class="color color1"></div>
                <div class="color-info">
                    <span class="color-code">#845ec2</span>
                    <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
                </div>
            </div>
            <div class="color-box">
                <div class="color color2"></div>
                <div class="color-info">
                    <span class="color-code">#4b4453</span>
                    <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
                </div>
            </div>
            <div class="color-box">
                <div class="color color3"></div>
                <div class="color-info">
                    <span class="color-code">#ff6f91</span>
                    <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
                </div>
            </div>
            <div class="color-box">
                <div class="color color4"></div>
                <div class="color-info">
                    <span class="color-code">#ff9671</span>
                    <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
                </div>
            </div>
            <div class="color-box">
                <div class="color color5"></div>
                <div class="color-info">
                    <span class="color-code">#b0a8b9</span>
                    <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
                </div>
            </div>
        </div>       
    </div>
    <script src="colorPalette.js"></script>
</body>
</html>
